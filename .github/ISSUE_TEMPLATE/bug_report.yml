name: Bug report
description: Report a reproducible problem with Login Pilot.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the private reporting link in SECURITY.md.
        Remove passwords, tokens, personal data, and private site URLs before posting.
  - type: input
    id: version
    attributes:
      label: Login Pilot version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use dummy accounts and sanitized example forms where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
