version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '02:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # Keep Node type definitions aligned with the supported Node 24 runtime.
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [patch, minor]
      npm-maintenance:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
