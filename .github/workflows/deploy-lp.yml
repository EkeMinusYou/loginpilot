name: Deploy LP

on:
  push:
    branches: [main]
    paths:
      - "sites/lp/**"
      - ".github/workflows/deploy-lp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate production wrangler config
        run: sed -e "s/YOUR_CLOUDFLARE_ACCOUNT_ID/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/" -e "s/YOUR_DOMAIN/loginpilot.ekeminusyou.com/" sites/lp/wrangler.production.example.jsonc > sites/lp/wrangler.production.jsonc
      - name: Build and deploy LP
        run: npm run lp:deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
