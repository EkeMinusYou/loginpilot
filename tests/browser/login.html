<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Login Pilot integration fixture</title>
<body>
<output id="clicks">0</output><output id="submits">0</output><output id="auth">idle</output>
<script>
  const query = new URLSearchParams(location.search);
  let clicks = 0, submits = 0;
  if (query.has('plain')) {
    document.body.insertAdjacentHTML('beforeend', '<p>Ordinary content page</p>');
  } else if (query.has('federated-single')) {
    document.body.insertAdjacentHTML('beforeend', '<button>Continue with Google</button>');
  } else if (query.has('federated-complete')) {
    document.querySelector('#auth').value = query.get('federated-complete');
  } else if (query.has('federated')) {
    document.body.insertAdjacentHTML('beforeend', '<form><input type="email" autocomplete="username" value="fixture@example.com"><input type="password" autocomplete="current-password" value="fixture-password"><button type="submit">Login</button></form><button type="submit" disabled id="google-login-page"><span><span>Continue with Google</span></span></button><button id="apple">Continue with Apple</button>');
    document.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#submits').value = String(++submits);
    });
    for (const [id, provider] of [['google-login-page', 'google'], ['apple', 'apple']]) {
      document.getElementById(id).addEventListener('click', () => {
        document.querySelector('#clicks').value = String(++clicks);
        if (query.has('cancel')) document.querySelector('#auth').value = 'cancelled';
        else location.href = `/?federated-complete=${provider}`;
      });
    }
  } else if (query.has('iam')) {
    // Mirror the public AWS IAM form's account/username/password order. Keep
    // framework state separate from prefilled DOM values until input events arrive.
    document.body.insertAdjacentHTML('beforeend', '<form><input type="text" id="account" name="account" value="123456789012"><input type="text" id="username" name="username" value="fixture-user"><input type="password" id="password" name="password" value="fixture-password"><button type="submit" id="signin_button">Sign in</button><button type="button">Sign in using root user email</button></form>');
    if (query.has('autocomplete')) {
      for (const input of document.querySelectorAll('input')) input.autocomplete = 'on';
    }
    const values = { username: '', password: '' };
    for (const name of ['username', 'password']) {
      document.getElementById(name).addEventListener('input', (event) => { values[name] = event.target.value; });
    }
    document.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#submits').value = String(++submits);
      document.querySelector('#auth').value = values.username === 'fixture-user' && values.password === 'fixture-password' ? 'success' : 'validation-error';
    });
    document.querySelector('#signin_button').addEventListener('click', () => {
      document.querySelector('#clicks').value = String(++clicks);
    });
  } else if (query.has('frame')) {
    document.body.insertAdjacentHTML('beforeend', '<iframe hidden src="http://localhost:4176/?passkey" allow="publickey-credentials-get"></iframe>');
  } else if (query.has('passkey')) {
    document.body.insertAdjacentHTML('beforeend', '<button id="passkey" disabled>Sign in with passkey</button>');
    let abort;
    document.querySelector('#passkey').addEventListener('click', async () => {
      document.querySelector('#clicks').value = String(++clicks);
      document.querySelector('#auth').value = 'pending';
      abort = new AbortController();
      try {
        await navigator.credentials.get({ signal: abort.signal, publicKey: {
          challenge: new Uint8Array([1, 2, 3, 4]), rpId: 'localhost',
          userVerification: 'required', timeout: 60000,
        } });
        document.querySelector('#auth').value = 'success';
      } catch (error) {
        document.querySelector('#auth').value = error.name;
      }
    });
    window.cancelAuthentication = () => abort?.abort();
  } else {
    document.body.insertAdjacentHTML('beforeend', '<form><input type="email" autocomplete="username" value="fixture@example.com"><input type="password" autocomplete="current-password" value="fixture-password"><button type="submit" disabled>Sign in</button></form>');
    const form = document.querySelector('form');
    if (query.has('manual')) {
      for (const input of form.querySelectorAll('input')) input.value = '';
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#submits').value = String(++submits);
      if (query.has('redirect')) location.href = 'http://localhost:4176/?plain';
    });
    document.querySelector('button').addEventListener('click', () => {
      document.querySelector('#clicks').value = String(++clicks);
    });
    if (query.has('mutate')) {
      form.addEventListener('input', () => {
        document.querySelector('input[type="password"]').autocomplete = 'new-password';
      }, { once: true });
    }
  }
</script>
</body>
</html>
