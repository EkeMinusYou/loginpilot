<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Login Pilot browser fixtures</title>
    <style>
      body { max-width: 640px; margin: 40px auto; padding: 20px; font-family: sans-serif; }
      nav { display: flex; gap: 16px; flex-wrap: wrap; }
      label { display: block; margin-top: 20px; }
      input { display: block; padding: 10px; width: 280px; }
      button { margin-top: 20px; padding: 10px 20px; }
      iframe { width: 100%; height: 500px; }
    </style>
  </head>
  <body>
    <h1>Login Pilot 動作確認用フォーム</h1>
    <p>ダミーの認証情報だけを使用してください。入力値は送信・保存しません。</p>
    <nav><a href="/login">ログイン</a><a href="/signup">新規登録</a><a href="/password-change">パスワード変更</a><a href="/iframe">iframe</a></nav>
    <main></main>
    <p id="submissions" role="status">送信回数: 0</p>
    <script>
      const mode = location.pathname;
      const main = document.querySelector('main');
      if (mode === '/iframe') {
        const frame = document.createElement('iframe');
        frame.src = '/login';
        frame.title = 'iframe login fixture';
        main.append(frame);
      } else {
        const form = document.createElement('form');
        form.method = 'post';
        function field(labelText, type, name, autocomplete) {
          const label = document.createElement('label');
          label.textContent = labelText;
          const input = document.createElement('input');
          input.type = type;
          input.name = name;
          input.autocomplete = autocomplete;
          input.required = true;
          label.append(input);
          form.append(label);
        }
        field('メールアドレス', 'email', 'username', 'username');
        field(mode === '/password-change' ? '現在のパスワード' : 'パスワード', 'password', 'password', mode === '/signup' ? 'new-password' : 'current-password');
        if (mode === '/password-change') field('新しいパスワード', 'password', 'newPassword', 'new-password');
        const button = document.createElement('button');
        button.type = 'submit';
        button.textContent = mode === '/signup' ? '登録' : mode === '/password-change' ? '変更' : 'ログイン';
        form.append(button);
        let submissions = 0;
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          document.querySelector('#submissions').textContent = `送信回数: ${++submissions}`;
        });
        main.append(form);
      }
    </script>
  </body>
</html>
